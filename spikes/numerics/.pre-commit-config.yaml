repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: numerics ruff format
        entry: uv run --project spikes/numerics ruff format --config spikes/numerics/pyproject.toml
        language: system
        types: [python]
        files: ^(spikes/numerics/|scripts/periodic-study-plot\.py$)
      - id: ruff-check
        name: numerics ruff lint
        entry: uv run --project spikes/numerics ruff check --config spikes/numerics/pyproject.toml
        language: system
        types: [python]
        files: ^(spikes/numerics/|scripts/periodic-study-plot\.py$)
      - id: ty
        name: numerics ty typecheck
        entry: uv run --project spikes/numerics --group plots ty check spikes/numerics scripts/periodic-study-plot.py
        language: system
        pass_filenames: false
        files: ^(spikes/numerics/.*\.py$|scripts/periodic-study-plot\.py$)
