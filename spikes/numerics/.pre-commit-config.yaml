repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: numerics ruff format
        entry: uv run --project spikes/numerics ruff format --config spikes/numerics/pyproject.toml
        language: system
        types: [python]
        files: ^(spikes/numerics/|scripts/periodic-study-plot\.py$|docs/design/(topology-study|orbital-model-set)/consultant/.*\.py$|docs/design/(surface-(ascent|landing)|staging|atmospheric-launch|surface-flexible|direct-surface|low-orbit-shuttle|freight-district|spatial-atmosphere|moving-selene|apollo|staged-refinement|mission-reference|compact-cycler)/.*\.py$)
      - id: ruff-check
        name: numerics ruff lint
        entry: uv run --project spikes/numerics ruff check --config spikes/numerics/pyproject.toml
        language: system
        types: [python]
        files: ^(spikes/numerics/|scripts/periodic-study-plot\.py$|docs/design/(topology-study|orbital-model-set)/consultant/.*\.py$|docs/design/(surface-(ascent|landing)|staging|atmospheric-launch|surface-flexible|direct-surface|low-orbit-shuttle|freight-district|spatial-atmosphere|moving-selene|apollo|staged-refinement|mission-reference|compact-cycler)/.*\.py$)
      - id: ty
        name: numerics ty typecheck
        entry: uv run --project spikes/numerics --group plots ty check spikes/numerics scripts/periodic-study-plot.py docs/design/topology-study/consultant docs/design/orbital-model-set/consultant docs/design/surface-ascent docs/design/surface-landing docs/design/staging docs/design/atmospheric-launch docs/design/surface-flexible docs/design/direct-surface docs/design/low-orbit-shuttle docs/design/freight-district docs/design/spatial-atmosphere docs/design/moving-selene docs/design/apollo docs/design/staged-refinement docs/design/mission-reference docs/design/compact-cycler
        language: system
        pass_filenames: false
        files: ^(spikes/numerics/.*\.py$|scripts/periodic-study-plot\.py$|docs/design/(topology-study|orbital-model-set)/consultant/.*\.py$|docs/design/(surface-(ascent|landing)|staging|atmospheric-launch|surface-flexible|direct-surface|low-orbit-shuttle|freight-district|spatial-atmosphere|moving-selene|apollo|staged-refinement|mission-reference|compact-cycler)/.*\.py$)
