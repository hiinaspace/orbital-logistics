<body data-style="flight"><div class="audition"><strong>Style study</strong><button data-theme="telemetry">A · Telemetry</button><button data-theme="flight" aria-pressed="true">B · Flight deck</button><button data-theme="observatory">C · Observatory</button><select id="font-choice" aria-label="Typeface"><option value="matched">Matched type</option><option value="telemetry">IBM Plex</option><option value="flight">Barlow</option><option value="observatory">Space Grotesk</option></select><span class="style-detail" id="style-detail">Space Grotesk · IBM Plex Mono</span><label><input id="panel-trim" type="checkbox" checked>Panel trim</label><a href="font-comparison.html">Compare</a></div><header><b>Orbital Logistics</b><button id="library-toggle">☰ Sets</button><span>Aster–Selene / Cycler fleet</span><select id="layout"><option value="overview">Overview + Chase</option><option value="frames">Inertial + Rotating</option><option value="ortho">Top + Front</option><option value="stack">Stacked views</option></select><button id="inspect-toggle">Inspector</button></header>
<div class="shell"><nav class="library"><div class="title">Model sets</div><input class="search" placeholder="Find a set…"><details open><summary>Aster–Selene</summary><button class="entry">Full service<span>Ground launches, lunar expeditions and relay traffic.</span></button><button class="entry on">Cycler fleet <i class="badge">CONTINUOUS</i><span>Passing carriers and riders between two worlds.</span></button><button class="entry">Northern launch<span>Atmospheric ascent, station visit and return.</span></button><button class="entry">Lunar ground service<span>Inclined orbital visits and surface arrivals.</span></button></details><details open><summary>Helion–Orison</summary><button class="entry">Observatory mission<span>Prism launches and settles into an L2 halo.</span></button><button class="entry">Continuous survey<span>Lumen weaves a changing spatial figure.</span></button></details><details><summary>Orison</summary></details><details><summary>Aster</summary></details><details><summary>Sol</summary></details></nav>

<script>
const overview=`<svg viewBox="0 0 600 600"><g fill="none" stroke="#2c4655"><ellipse cx="285" cy="320" rx="250" ry="155" transform="rotate(-30 285 320)"/><ellipse cx="285" cy="320" rx="230" ry="150" transform="rotate(23 285 320)"/><ellipse cx="225" cy="330" rx="105" ry="100" stroke-dasharray="3 7"/></g><circle cx="225" cy="330" r="48" fill="#1c303e" stroke="#516d7d"/><circle cx="448" cy="250" r="17" fill="#233744" stroke="#607e8e"/><path d="M480 202C465 95 195 68 75 240S165 508 323 464" fill="none" stroke="#b5bc9a" stroke-width="1.4"/><path d="M90 268C82 382 258 470 448 278" fill="none" stroke="#8dbdc4" stroke-width="1.4"/><g fill="#b6cad7" font-family="system-ui" font-size="12"><text x="182" y="397">Aster</text><text x="468" y="255">Selene</text><text x="329" y="467">Wayfarer</text><text x="67" y="256">Nomad</text></g><g fill="#e0c482"><circle cx="323" cy="464" r="4"/><circle cx="323" cy="464" r="10" fill="none" stroke="#e0c482"/></g><path d="M86 260l10 6-9 6z" fill="#8fc6ce"/></svg>`;
const close=`<svg viewBox="0 0 600 600"><defs><radialGradient id="planet"><stop stop-color="#264454"/><stop offset="1" stop-color="#192b37"/></radialGradient></defs><circle cx="365" cy="120" r="230" fill="url(#planet)" stroke="#526d7e"/><g fill="none" stroke="#416171" opacity=".45"><ellipse cx="365" cy="120" rx="90" ry="230"/><ellipse cx="365" cy="120" rx="180" ry="230"/><ellipse cx="365" cy="120" rx="230" ry="65"/><ellipse cx="365" cy="120" rx="230" ry="160"/></g><path d="M35 570C120 430 280 355 530 310" fill="none" stroke="#789fae" stroke-width="1.5"/><path d="M285 367l27-8-9 28-6-14z" fill="#b9d9db" stroke="#dde7e7"/><g stroke="#d9b985" opacity=".7"><path d="M295 379l-10 10M247 393l-7 10M342 350l-8 10"/></g><text x="317" y="400" fill="#a5c5cd" font-family="system-ui" font-size="12">Nomad</text></svg>`;
document.querySelector('#overview').innerHTML=overview;document.querySelector('#close').innerHTML=close;let active='A';const selected={A:'Wayfarer',B:'Nomad'};
function sync(){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===active));document.querySelector('#inspector-title').textContent='View '+active+' · Selection';document.querySelector('#actor').textContent=selected[active];document.querySelectorAll('[data-ship]').forEach(b=>b.classList.toggle(b.classList.contains('lane-name')?'selected':'on',b.dataset.ship===selected[active]));}
document.querySelectorAll('.pane').forEach(p=>{p.onpointerdown=()=>{active=p.dataset.pane;sync();};p.onfocusin=()=>{active=p.dataset.pane;sync();};p.querySelector('.display').onclick=()=>{let pop=p.querySelector('.popover');if(pop){pop.remove();return;}pop=document.createElement('div');pop.className='popover';pop.innerHTML='<b>Paths</b><label><input type="checkbox" checked> Past trails</label><label>Trail length · 2 loops<input type="range" value="65"></label><label><input type="checkbox" checked> Future route</label><label><input type="checkbox" checked> Orbit guides</label><hr><b>Appearance</b><label><input type="checkbox" checked> Labels</label><label><input type="checkbox"> See-through bodies</label><hr><b>Dynamics</b><label><input type="checkbox"> Potential / relief</label>';p.append(pop);};});
document.querySelectorAll('[data-ship]').forEach(b=>b.onclick=()=>{selected[active]=b.dataset.ship;sync();});document.querySelector('#library-toggle').onclick=()=>document.querySelector('.shell').classList.toggle('hide-library');document.querySelector('#inspect-toggle').onclick=()=>document.querySelector('.shell').classList.toggle('hide-inspector');document.querySelector('#layout').onchange=e=>{const stacked=e.target.value==='stack';document.querySelector('.panes').style.gridTemplateColumns=stacked?'1fr':'1fr 1fr';document.querySelector('.panes').style.gridTemplateRows=stacked?'1fr 1fr':'1fr';const a=document.querySelector('[data-pane=A]'),b=document.querySelector('[data-pane=B]');if(e.target.value==='frames'){a.querySelector('.frame').selectedIndex=0;b.querySelector('.frame').selectedIndex=2;a.querySelector('.camera').selectedIndex=0;b.querySelector('.camera').selectedIndex=2;}if(e.target.value==='ortho'){a.querySelector('.camera').selectedIndex=0;b.querySelector('.camera').selectedIndex=3;}};
</script><script src="audition.js"></script></body></html>
